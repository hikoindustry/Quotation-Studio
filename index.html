<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIKO Quotation Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#072b42;--navy-2:#0d3a57;--gold:#c39a3a;--gold-soft:#f6efdd;--ink:#1b2632;--muted:#66717f;
  --line:#e3e7ec;--bg:#eef1f4;--card:#fff;--danger:#b4372f;
  --font:"Poppins","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* top bar */
.bar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.bar-in{max-width:1440px;margin:auto;display:flex;align-items:center;gap:18px;padding:10px 24px}
.bar img{height:44px;display:block}
.bar h1{font-size:17px;font-weight:500;margin:0;letter-spacing:.2px}
.bar p{margin:0;font-size:12px;color:#a9bccb}
.bar .sp{flex:1}
.bbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.bbtn:hover{background:rgba(255,255,255,.08)}
.bbtn.gold{background:var(--gold);border-color:var(--gold);color:#1d1606;font-weight:500}
.bbtn.gold:hover{background:#d2aa48}

.wrap{max-width:1440px;margin:auto;padding:20px 24px 60px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:500;margin:0 0 14px;color:var(--navy);display:flex;align-items:center;gap:10px}
.card h2 .n{font-size:12px;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.f label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
.f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid #d5dbe2;border-radius:8px;background:#fff;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(13,58,87,.12)}
.f textarea{resize:vertical;min-height:84px;line-height:1.45}

/* category switch */
.seg{display:inline-flex;background:#f1f3f6;border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--navy);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* search */
.search{position:relative;flex:1;min-width:200px}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid #d5dbe2;border-radius:8px;outline:none}
.search input:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(13,58,87,.12)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(7,43,66,.14);max-height:340px;overflow:auto;z-index:15;display:none}
.results.open{display:block}
.res{display:flex;gap:10px;align-items:center;padding:8px 10px;border:0;background:none;width:100%;text-align:left}
.res:hover,.res.act{background:#f3f6f9}
.res img{width:40px;height:40px;object-fit:contain;background:#f7f8fa;border-radius:6px}
.res b{font-weight:500;font-size:13px;display:block}
.res small{color:var(--muted);font-size:11px}

.picker{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;margin-top:14px;align-items:start}
.pimg{width:120px;height:120px;border-radius:10px;background:#f6f7f9;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line)}
.pimg img{max-width:100%;max-height:100%;object-fit:contain}
.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pfoot{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.lp{font-size:13px;color:var(--muted)}
.lp b{color:var(--navy);font-size:17px;font-weight:500}
.addbtn{margin-left:auto;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.addbtn:hover{background:var(--navy-2)}
.note{font-size:12px;color:var(--gold);margin-top:2px}

/* items */
.rows{display:flex;flex-direction:column}
.grp{font-size:12px;color:var(--navy);font-weight:500;padding:12px 0 6px;border-bottom:1px solid var(--gold);display:flex;justify-content:space-between}
.row{display:grid;grid-template-columns:46px minmax(0,1fr) 120px 70px 92px 66px 96px 30px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row img{width:46px;height:46px;object-fit:contain;background:#f6f7f9;border-radius:6px}
.row .nm b{display:block;font-weight:500;font-size:13px;line-height:1.3}
.row .nm small{color:var(--muted);font-size:11.5px}
.row input,.row select{width:100%;padding:6px 7px;border:1px solid #d5dbe2;border-radius:6px;font-size:13px;background:#fff}
.row .amt{text-align:right;font-weight:500;font-size:13px}
.row .x{border:0;background:#f2f4f7;border-radius:6px;width:28px;height:28px;color:var(--muted);font-size:16px;line-height:1}
.row .x:hover{background:#fbe9e7;color:var(--danger)}
.rh{display:grid;grid-template-columns:46px minmax(0,1fr) 120px 70px 92px 66px 96px 30px;gap:8px;font-size:11px;color:var(--muted);padding:0 0 4px}
.rh span:nth-child(7){text-align:right}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed #cfd6de;border-radius:10px}
.req{border-color:var(--gold)!important;background:var(--gold-soft)!important}

.toggles{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.tg{display:flex;align-items:center;gap:8px;font-size:13px}
.tg input{width:16px;height:16px;accent-color:var(--navy)}

/* preview */
.side{position:sticky;top:84px}
.ptitle{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
.ptitle h2{font-size:15px;font-weight:500;color:var(--navy);margin:0}
.ptitle span{font-size:12px;color:var(--muted)}
.stage{background:#d9dee4;border-radius:12px;padding:14px;overflow:hidden}
.scaler{transform-origin:top left}

/* ===== quotation document ===== */
.doc{width:794px;background:#fff;color:#1b2632;font-family:var(--font);font-size:12px;line-height:1.5;box-shadow:0 6px 24px rgba(7,43,66,.18)}
.d-head{background:var(--navy);color:#fff;padding:26px 36px 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.d-head img{height:62px;display:block}
.d-tag{font-size:10.5px;color:#a9bccb;margin-top:6px;letter-spacing:.3px}
.d-q{text-align:right}
.d-q h3{margin:0;font-size:26px;font-weight:300;letter-spacing:.5px}
.d-q div{font-size:11px;color:#c9d6e0}
.d-q strong{color:#fff;font-weight:500}
.d-gold{height:4px;background:var(--gold)}
.d-info{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:20px;padding:18px 36px;background:#f6f8fa;border-bottom:1px solid #e6eaee}
.d-info .k{font-size:10px;color:#7a8592;margin-bottom:2px}
.d-info .v{font-weight:500;font-size:13px;color:var(--navy)}
.d-info .s{color:#56616e;font-size:11px;white-space:pre-line}
.d-body{padding:6px 36px 0}
.d-grp{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 0;padding:0 0 6px;border-bottom:1.5px solid var(--gold);break-after:avoid;page-break-after:avoid}
.d-grp b{font-size:14px;font-weight:500;color:var(--navy)}
.d-grp span{font-size:10.5px;color:#7a8592}
.d-th,.d-tr{display:grid;gap:12px;align-items:center}
.d-th{font-size:9.5px;color:#7a8592;padding:7px 0 3px;break-after:avoid;page-break-after:avoid}
.d-tr{padding:9px 0;border-bottom:1px solid #edf0f3;break-inside:avoid;page-break-inside:avoid}
.d-tr .im{width:62px;height:62px;border-radius:8px;background:#f5f6f8;display:flex;align-items:center;justify-content:center;overflow:hidden}
.d-tr .im img{max-width:56px;max-height:56px;object-fit:contain}
.d-tr .pn{font-weight:500;font-size:12.5px;color:#13212e;line-height:1.3}
.d-tr .ps{font-size:11px;color:#56616e;margin-top:2px}
.d-tr .pw{font-size:10px;color:#a37d24;margin-top:2px}
.r{text-align:right}
.d-tr .r{font-variant-numeric:tabular-nums}
.d-tr .am{font-weight:500;color:#13212e}
.d-tr .old{display:block;font-size:10px;color:#98a1ab;text-decoration:line-through}
.d-sub{display:flex;justify-content:flex-end;gap:24px;font-size:11px;color:#56616e;padding:6px 0 0}
.d-sub b{color:#13212e;font-weight:500;min-width:90px;text-align:right}
.d-foot{display:grid;grid-template-columns:1fr 300px;gap:30px;padding:22px 36px 26px;break-inside:avoid;page-break-inside:avoid}

.d-total{display:grid;grid-template-columns:1fr 320px;gap:30px;align-items:end;padding:22px 36px 26px;margin-top:8px;break-inside:avoid;page-break-inside:avoid}
.d-thanks{font-size:10.5px;color:#56616e;border-left:3px solid var(--gold);padding:2px 0 2px 12px;margin-top:16px;max-width:360px}
.d-thanks b{display:block;color:var(--navy);font-weight:500;font-size:12px;margin-bottom:2px}

.d-t{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;color:#56616e}
.d-t b{color:#13212e;font-weight:500}
.d-grand{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;border-radius:8px;padding:11px 14px;margin-top:8px}
.d-grand span{font-size:12px}
.d-grand b{font-size:19px;font-weight:500}
.d-words{font-size:10.5px;color:#56616e;margin-top:7px}
.d-gst{font-size:10px;color:#a37d24;margin-top:3px}
.d-terms h4,.d-pay h4{font-size:11px;font-weight:500;color:var(--navy);margin:0 0 4px}
.d-terms ol{margin:0;padding-left:16px;font-size:10.5px;color:#56616e}
.d-terms li{margin-bottom:2px}
.d-pay{margin-top:14px;font-size:10.5px;color:#56616e;white-space:pre-line}
.d-sign{display:flex;justify-content:space-between;align-items:flex-end;padding:26px 36px 18px;break-inside:avoid;page-break-inside:avoid}
.d-sign .t{font-size:10.5px;color:#56616e;max-width:360px}
.d-sign .s{text-align:center;font-size:10.5px;color:#56616e}
.d-sign .s div{width:190px;border-top:1px solid #9aa4ae;margin:34px 0 4px}
.d-sign .s b{display:block;color:var(--navy);font-weight:500}
.d-end{border-top:3px solid var(--gold);background:var(--navy);color:#c9d6e0;font-size:10px;display:flex;justify-content:space-between;padding:10px 36px;flex-wrap:wrap;gap:6px}
.d-empty{padding:60px 36px;text-align:center;color:#8a949f;font-size:13px}

/* drawer */
.drawer{position:fixed;inset:0;background:rgba(7,25,38,.45);display:none;z-index:40}
.drawer.open{display:block}
.dpanel{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:#fff;padding:20px;overflow:auto}
.dpanel h3{margin:0 0 4px;font-size:16px;font-weight:500;color:var(--navy)}
.dpanel p{margin:0 0 14px;font-size:12px;color:var(--muted)}
.sq{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.sq div{flex:1;min-width:0}
.sq b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq small{color:var(--muted);font-size:11.5px}
.sbtn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;font-size:12px}
.sbtn:hover{background:#f3f6f9}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1180px){.wrap{grid-template-columns:minmax(0,1fr)}.side{position:static}}
@media (max-width:760px){
  .bar{position:static}.bar-in{flex-wrap:wrap;padding:10px 14px;gap:8px}.bar img{height:34px}.bbtn{padding:6px 10px;font-size:12px}.bar .sp{display:none}.wrap{padding:14px}
  .rh{display:none}
  .row{grid-template-columns:46px minmax(0,1fr) 30px;grid-template-areas:"i n x" "f f f"}
  .row img{grid-area:i}.row .nm{grid-area:n}.row .x{grid-area:x}
  .row .rf{grid-area:f;display:grid;grid-template-columns:1.4fr .8fr 1fr .8fr 1fr;gap:6px;align-items:center}
  .picker{grid-template-columns:1fr}.pimg{width:100%;height:150px}
}
@media (min-width:761px){.row .rf{display:contents}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@page{margin:0}
@media print{
  body{background:#fff}
  .bar,.editor,.ptitle,.drawer,.toast{display:none!important}
  .wrap{display:block;padding:0;max-width:none}
  .side{position:static}
  .stage{background:none;padding:0;border-radius:0;height:auto!important;overflow:visible}
  .scaler{transform:none!important}
  .doc{width:210mm;box-shadow:none}
  html,body{background:#072b42!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .d-head,.d-gold,.d-info,.d-grand,.d-end,.d-tr .im{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

    <div><h1>Quotation Studio</h1><p>Hardware and Wardrobe Accessories · Price List 2026</p></div>
    <div class="sp"></div>
    <button class="bbtn" id="btnSaved">Saved quotes</button>
    <button class="bbtn" id="btnNew">New quote</button>
    <button class="bbtn" id="btnSave">Save</button>
    <button class="bbtn" id="btnWa">WhatsApp summary</button>
    <button class="bbtn gold" id="btnPdf">Download PDF</button>

<main class="wrap">
  <section class="editor">
    <div class="card">
      <h2>Customer and project</h2>
      <div class="grid">
        <div class="f"><label for="m_customer">Customer or company</label><input id="m_customer" placeholder="Sharma Residence"></div>
        <div class="f"><label for="m_phone">Mobile</label><input id="m_phone" placeholder="+91 98765 43210" inputmode="tel"></div>
        <div class="f"><label for="m_site">Site or address</label><input id="m_site" placeholder="Sector 62, Noida"></div>
        <div class="f"><label for="m_architect">Architect or interior designer</label><input id="m_architect" placeholder="Optional"></div>
      </div>
    </div>

    <div class="card">
      <h2>Quotation</h2>
      <div class="grid">
        <div class="f"><label for="m_no">Quotation no.</label><input id="m_no"></div>
        <div class="f"><label for="m_date">Date</label><input id="m_date" type="date"></div>
        <div class="f"><label for="m_valid">Valid for (days)</label><input id="m_valid" type="number" min="1" value="30"></div>
        <div class="f"><label for="m_by">Prepared by</label><input id="m_by" placeholder="Name, depot"></div>
        <div class="f"><label for="m_byphone">Contact number</label><input id="m_byphone" placeholder="+91 …" inputmode="tel"></div>
      </div>
    </div>

    <div class="card">
      <h2>Add products <span class="n" id="catCount"></span></h2>
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        <div class="seg" role="group" aria-label="Category">
          <button data-cat="Hardware" aria-pressed="true">Hardware</button>
          <button data-cat="Wardrobe Accessories" aria-pressed="false">Wardrobe</button>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" placeholder="Search any product, size or model" autocomplete="off" aria-label="Search products">
          <div class="results" id="results" role="listbox"></div>
        </div>
      </div>
      <div class="picker">
        <div class="pimg" id="pImg"></div>
        <div>
          <div class="pform">
            <div class="f" style="grid-column:1/-1"><label for="pProd">Product</label><select id="pProd"></select></div>
            <div class="f"><label for="pVar">Size or model</label><select id="pVar"></select></div>
            <div class="f" id="finWrap"><label for="pFin">Finish</label><select id="pFin"></select></div>
            <div class="f"><label for="pRoom">Room or area</label><input id="pRoom" list="rooms" value="Kitchen"></div>
            <div class="f"><label for="pQty">Qty</label><input id="pQty" type="number" min="1" value="1"></div>
          </div>
          <div class="note" id="pNote"></div>
          <div class="pfoot">
            <div class="lp" id="pPrice"></div>
            <button class="addbtn" id="btnAdd">+ Add to quotation</button>
          </div>
        </div>
      </div>
      <datalist id="rooms"><option>Kitchen</option><option>Wardrobe</option><option>Master bedroom</option><option>Kids bedroom</option><option>Guest bedroom</option><option>Living room</option><option>Dining</option><option>Main door</option><option>Utility</option><option>General</option></datalist>
    </div>

    <div class="card">
      <h2>Quotation items <span class="n" id="itemCount"></span></h2>
      <div class="rh"><span></span><span>Product</span><span>Room</span><span>Qty</span><span>Rate (₹)</span><span>Disc %</span><span>Amount</span><span></span></div>
      <div class="rows" id="rows"></div>
    </div>

    <div class="card">
      <h2>Pricing and terms</h2>
      <div class="grid">
        <div class="f"><label for="m_disc">Special discount on total (%)</label><input id="m_disc" type="number" min="0" max="100" step="0.5" value="0"></div>
        <div class="f"><label for="m_discLabel">Discount label</label><input id="m_discLabel" value="Special discount"></div>
        <div class="f"><label for="m_round">Round off grand total</label><select id="m_round"><option value="1">Yes, to nearest rupee</option><option value="0">No</option></select></div>
      </div>
      <div class="toggles">
        <label class="tg"><input type="checkbox" id="t_hide"> Hide prices (product proposal)</label>
        <label class="tg"><input type="checkbox" id="t_group" checked> Group items by room</label>
        <label class="tg"><input type="checkbox" id="t_img" checked> Show product photos</label>
      </div>
      <div class="grid" style="margin-top:14px">
        <div class="f" style="grid-column:1/-1"><label for="m_terms">Terms and conditions (one per line)</label><textarea id="m_terms" rows="5"></textarea></div>
        <div class="f" style="grid-column:1/-1"><label for="m_pay">Payment and bank details</label><textarea id="m_pay" rows="3" placeholder="Bank name, account no., IFSC, UPI ID"></textarea></div>
      </div>
    </div>
  </section>

  <aside class="side">
    <div class="ptitle"><h2>Live preview</h2><span>A4 · ready to print or share</span></div>
    <div class="stage" id="stage"><div class="scaler" id="scaler"><div class="doc" id="doc"></div></div></div>
  </aside>
</main>

const FINISHES=["Mocha","Harma","Tiffany"];
const DEFAULT_TERMS=["All prices are as per HIKO Price List 2026 and inclusive of GST.","Quotation valid for the period mentioned above.","Delivery within 5–7 working days from order confirmation, subject to stock.","Payment: 50% advance with order, balance before dispatch.","Installation and transportation charges extra unless mentioned.","Warranty as per HIKO product warranty terms."];
const $=id=>document.getElementById(id);
const byId=Object.fromEntries(CATALOG.map(p=>[p.id,p]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let cat="Hardware", items=[], currentId=null;

/* ---------- helpers ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function money(n,sym=true){const v=Math.round((Number(n)||0)*100)/100;const s=v.toLocaleString("en-IN",{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2});return sym?"₹ "+s:s}
function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function fy(d){const t=d?new Date(d):new Date();const y=t.getFullYear(),m=t.getMonth();const s=m>=3?y:y-1;return s+"-"+String((s+1)%100).padStart(2,"0")}
function nextNo(){const c=LS.get("hiko_q_counter",0)+1;return {no:`HIKO/${fy()}/${String(c).padStart(4,"0")}`,c}}
function fmtDate(v){if(!v)return"—";return new Date(v+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function addDays(v,n){if(!v)return"";const d=new Date(v+"T00:00:00");d.setDate(d.getDate()+(Number(n)||0));return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function words(num){
  num=Math.round(num);if(num===0)return"Zero";
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=n=>n<20?a[n]:b[Math.floor(n/10)]+(n%10?" "+a[n%10]:"");
  const three=n=>(n>=100?a[Math.floor(n/100)]+" Hundred"+(n%100?" ":""):"")+(n%100?two(n%100):"");
  let out=[];const cr=Math.floor(num/1e7);num%=1e7;const l=Math.floor(num/1e5);num%=1e5;const t=Math.floor(num/1e3);num%=1e3;
  if(cr)out.push(three(cr)+" Crore");if(l)out.push(two(l)+" Lakh");if(t)out.push(two(t)+" Thousand");if(num)out.push(three(num));
  return out.join(" ");
}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200)}

function listPrice(p,vi,fin){const v=p.v[vi];if(!v)return null;if(v.f)return v.f[fin]??null;return v.p??null}
function variantImg(p,vi){return IMG[(p.v[vi]&&p.v[vi].img)||p.img]||""}
function finishesFor(p,vi){const v=p.v[vi];return v&&v.f?FINISHES.filter(f=>v.f[f]!=null):[]}

/* ---------- picker ---------- */
function fillProducts(){
  const list=CATALOG.filter(p=>p.cat===cat);
  let html="",sec="";
  list.forEach(p=>{if(p.sec!==sec){if(sec)html+="</optgroup>";sec=p.sec;html+=`<optgroup label="${esc(sec[0].toUpperCase()+sec.slice(1))}">`}html+=`<option value="${p.id}">${esc(p.name)}</option>`});
  $("pProd").innerHTML=html+"</optgroup>";
  $("catCount").textContent=`${list.length} products · ${list.reduce((s,p)=>s+p.v.length,0)} sizes`;
  if(!list.find(p=>p.id===currentId))currentId=list[0].id;
  $("pProd").value=currentId;fillVariants();
}
function fillVariants(){
  const p=byId[currentId];
  $("pVar").innerHTML=p.v.map((v,i)=>{const pr=v.f?Math.min(...FINISHES.map(f=>v.f[f]).filter(x=>x!=null)):v.p;return`<option value="${i}">${esc(v.l)}${pr==null?" · on request":""}</option>`}).join("");
  fillFinish();
}
function fillFinish(){
  const p=byId[currentId],vi=+$("pVar").value||0,fins=finishesFor(p,vi);
  $("finWrap").style.display=fins.length?"":"none";
  const keep=$("pFin").value;
  $("pFin").innerHTML=fins.map(f=>`<option>${f}</option>`).join("");
  if(fins.includes(keep))$("pFin").value=keep;
  updatePick();
}
function updatePick(){
  const p=byId[currentId],vi=+$("pVar").value||0,fin=$("pFin").value,v=p.v[vi];
  const src=variantImg(p,vi);
  $("pImg").innerHTML=src?`<img src="${src}" alt="${esc(p.name)}">`:"";
  const pr=listPrice(p,vi,v.f?fin:null);
  const extra=[v.s,p.note].filter(Boolean).join(" · ");
  $("pNote").textContent=extra;
  let fl="";
  if(v.f){fl=FINISHES.map(f=>`${f} ${v.f[f]==null?"N/A":money(v.f[f])}`).join("  ·  ")}
  $("pPrice").innerHTML=pr==null?`<b>On request</b><br>Enter the rate after adding`:`List price <b>${money(pr)}</b>${fl?`<br><span style="font-size:11.5px">${fl}</span>`:""}`;
}
function setCat(c){
  cat=c;document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cat===c));
  if(c==="Wardrobe Accessories"&&$("pRoom").value==="Kitchen")$("pRoom").value="Wardrobe";
  if(c==="Hardware"&&$("pRoom").value==="Wardrobe")$("pRoom").value="Kitchen";
  fillProducts();
}
function addItem(){
  const p=byId[currentId],vi=+$("pVar").value||0,v=p.v[vi],fin=v.f?$("pFin").value:null;
  const qty=Math.max(1,parseInt($("pQty").value)||1);
  const room=($("pRoom").value||"General").trim();
  const ex=items.find(x=>x.pid===p.id&&x.vi===vi&&x.fin===fin&&x.room===room);
  if(ex){ex.qty+=qty}else items.push({pid:p.id,vi,fin,room,qty,rate:listPrice(p,vi,fin)==null?null:undefined,disc:0});
  $("pQty").value=1;render();toast(`Added ${p.name}`);
}

/* ---------- search ---------- */
let hits=[],act=-1;
function doSearch(){
  const q=$("q").value.trim().toLowerCase();const box=$("results");
  if(!q){box.classList.remove("open");return}
  const terms=q.split(/\s+/);hits=[];
  CATALOG.forEach(p=>p.v.forEach((v,i)=>{
    const hay=(p.name+" "+v.l+" "+(v.s||"")+" "+p.sec+" "+p.cat).toLowerCase();
    if(terms.every(t=>hay.includes(t)))hits.push({p,i});
  }));
  const seen=new Set();hits=hits.filter(h=>{const k=h.p.id+(terms.length>1||/\d/.test(q)?"_"+h.i:"");if(seen.has(k))return false;seen.add(k);return true}).slice(0,30);
  act=-1;
  box.innerHTML=hits.length?hits.map((h,k)=>{const v=h.p.v[h.i];const pr=v.f?v.f.Mocha??v.f.Harma:v.p;return`<button class="res" role="option" data-k="${k}"><img src="${variantImg(h.p,h.i)}" alt=""><span><b>${esc(h.p.name)}</b><small>${esc(v.l)} · ${h.p.cat==="Hardware"?"Hardware":"Wardrobe"}${pr!=null?" · from "+money(pr):""}</small></span></button>`}).join(""):`<div style="padding:12px;font-size:13px;color:var(--muted)">No match. Try a size like 18 or a word like hinge.</div>`;
  box.classList.add("open");
}
function pickHit(k){const h=hits[k];if(!h)return;if(h.p.cat!==cat)setCat(h.p.cat);currentId=h.p.id;$("pProd").value=currentId;fillVariants();$("pVar").value=h.i;fillFinish();$("results").classList.remove("open");$("q").value="";$("pQty").focus()}

/* ---------- items editor ---------- */
function itemPrice(x){const p=byId[x.pid];const lp=listPrice(p,x.vi,x.fin);return x.rate!==undefined&&x.rate!==null&&lp==null?x.rate:lp}
function lineAmt(x){const r=itemPrice(x);if(r==null)return null;return r*x.qty*(1-(Number(x.disc)||0)/100)}
function renderRows(){
  const el=$("rows");$("itemCount").textContent=items.length?`${items.length} line${items.length>1?"s":""}`:"";
  if(!items.length){el.innerHTML=`<div class="empty">Search or pick a product above, then add it to start the quotation.</div>`;return}
  const order=orderedItems();let html="",room=null;
  order.forEach(({x,i})=>{
    if($("t_group").checked&&x.room!==room){room=x.room;html+=`<div class="grp"><span>${esc(room)}</span></div>`}
    const p=byId[x.pid],v=p.v[x.vi],lp=listPrice(p,x.vi,x.fin),amt=lineAmt(x);
    html+=`<div class="row">
      <img src="${variantImg(p,x.vi)}" alt="">
      <div class="nm"><b>${esc(p.name)}</b><small>${esc([v.l,x.fin,v.s].filter(Boolean).join(" · "))}</small></div>
      <div class="rf">
      <input value="${esc(x.room)}" list="rooms" aria-label="Room" onchange="upd(${i},'room',this.value)">
      <input type="number" min="1" value="${x.qty}" aria-label="Quantity" onchange="upd(${i},'qty',this.value)">
      ${lp==null?`<input class="req" type="number" min="0" step="0.01" placeholder="Enter rate" value="${x.rate??""}" aria-label="Rate" onchange="upd(${i},'rate',this.value)">`:`<input value="${money(lp,false)}" aria-label="List rate" readonly tabindex="-1" style="background:#f6f7f9;border-color:#e6e9ed">`}
      <input type="number" min="0" max="100" step="0.5" value="${x.disc||0}" aria-label="Line discount percent" onchange="upd(${i},'disc',this.value)">
      <div class="amt">${amt==null?"—":money(amt)}</div>
      </div>
      <button class="x" onclick="removeItem(${i})" aria-label="Remove ${esc(p.name)}">×</button>
    </div>`;
  });
  el.innerHTML=html;
}
function orderedItems(){
  const arr=items.map((x,i)=>({x,i}));
  if(!$("t_group").checked)return arr;
  const rooms=[];arr.forEach(o=>{if(!rooms.includes(o.x.room))rooms.push(o.x.room)});
  return rooms.flatMap(r=>arr.filter(o=>o.x.room===r));
}
window.upd=(i,k,val)=>{const x=items[i];if(k==="room")x.room=val.trim()||"General";else if(k==="qty")x.qty=Math.max(1,parseInt(val)||1);else if(k==="disc")x.disc=Math.min(100,Math.max(0,Number(val)||0));else if(k==="rate")x.rate=val===""?null:Math.max(0,Number(val));render()};
window.removeItem=i=>{items.splice(i,1);render()};

/* ---------- totals ---------- */
function totals(){
  let gross=0,lineDisc=0,pending=0;
  items.forEach(x=>{const r=itemPrice(x);if(r==null){pending++;return}const g=r*x.qty;gross+=g;lineDisc+=g*(Number(x.disc)||0)/100});
  const after=gross-lineDisc;const pct=Math.min(100,Math.max(0,Number($("m_disc").value)||0));const sd=after*pct/100;
  let grand=after-sd;let round=0;if($("m_round").value==="1"){const g=Math.round(grand);round=g-grand;grand=g}
  return{gross,lineDisc,pct,sd,grand,round,pending};
}

/* ---------- document ---------- */
function renderDoc(){
  const hide=$("t_hide").checked,showImg=$("t_img").checked,group=$("t_group").checked;
  const anyDisc=!hide&&items.some(x=>Number(x.disc)>0);
  const cols=[showImg?"62px":null,"minmax(0,1fr)","44px",hide?null:"84px",anyDisc?"50px":null,hide?null:"96px"].filter(Boolean).join(" ");
  const T=totals();
  const m=id=>$(id).value.trim();
  let body="";
  if(!items.length){body=`<div class="d-empty">Products you add will appear here as a catalogue-style quotation.</div>`}
  else{
    const ord=orderedItems();
    const rooms=group?[...new Set(ord.map(o=>o.x.room))]:[null];
    let n=0;
    rooms.forEach(r=>{
      const list=r===null?ord:ord.filter(o=>o.x.room===r);
      if(group){const sub=list.reduce((s,o)=>s+(lineAmt(o.x)||0),0);body+=`<div class="d-grp"><b>${esc(r)}</b><span>${list.length} item${list.length>1?"s":""}${hide?"":" · "+money(sub)}</span></div>`}
      body+=`<div class="d-th" style="grid-template-columns:${cols}">${showImg?"<span></span>":""}<span>Product</span><span class="r">Qty</span>${hide?"":'<span class="r">Rate</span>'}${anyDisc?'<span class="r">Disc</span>':""}${hide?"":'<span class="r">Amount</span>'}</div>`;
      list.forEach(({x})=>{
        n++;const p=byId[x.pid],v=p.v[x.vi],r=itemPrice(x),a=lineAmt(x);
        const spec=[v.l,x.fin?x.fin+" finish":"",v.s].filter(Boolean).join(" · ");
        body+=`<div class="d-tr" style="grid-template-columns:${cols}">
          ${showImg?`<div class="im"><img src="${variantImg(p,x.vi)}" alt=""></div>`:""}
          <div><div class="pn">${esc(p.name)}</div><div class="ps">${esc(spec)}</div>${p.note?`<div class="pw">${esc(p.note)}</div>`:""}</div>
          <div class="r">${x.qty}</div>
          ${hide?"":`<div class="r">${r==null?"On request":money(r)}</div>`}
          ${anyDisc?`<div class="r">${Number(x.disc)>0?x.disc+"%":"—"}</div>`:""}
          ${hide?"":`<div class="r am">${a==null?"—":money(a)}${Number(x.disc)>0&&r!=null?`<span class="old">${money(r*x.qty)}</span>`:""}</div>`}
        </div>`;
      });
    });
  }
  const terms=m("m_terms").split("\n").map(s=>s.trim()).filter(Boolean);
  const totalsHtml=hide?`<div class="d-t"><span>Total items</span><b>${items.reduce((s,x)=>s+x.qty,0)} pcs · ${items.length} lines</b></div><div class="d-gst">Prices shared separately on request.</div>`:
   `<div class="d-t"><span>Total at list price</span><b>${money(T.gross)}</b></div>
    ${T.lineDisc>0?`<div class="d-t"><span>Item discounts</span><b>− ${money(T.lineDisc)}</b></div>`:""}
    ${T.pct>0?`<div class="d-t"><span>${esc(m("m_discLabel")||"Special discount")} (${T.pct}%)</span><b>− ${money(T.sd)}</b></div>`:""}
    ${Math.abs(T.round)>=0.005?`<div class="d-t"><span>Round off</span><b>${T.round>0?"+ ":"− "}${money(Math.abs(T.round))}</b></div>`:""}
    <div class="d-grand"><span>Grand total</span><b>${money(T.grand)}</b></div>
    <div class="d-words">Rupees ${words(T.grand)} only</div>
    <div class="d-gst">All prices inclusive of GST${T.pending?` · ${T.pending} item${T.pending>1?"s":""} on request, not included`:""}</div>`;
  $("doc").innerHTML=`
    <div class="d-head">
      <div><img src="${LOGO}" alt="HIKO"><div class="d-tag">Premium hardware and wardrobe accessories</div></div>
      <div class="d-q"><h3>Quotation</h3><div>No. <strong>${esc(m("m_no")||"—")}</strong></div><div>Date <strong>${fmtDate(m("m_date"))}</strong></div><div>Valid till <strong>${addDays(m("m_date"),m("m_valid"))||"—"}</strong></div></div>
    </div>
    <div class="d-gold"></div>
    <div class="d-info">
      <div><div class="k">Prepared for</div><div class="v">${esc(m("m_customer")||"Customer name")}</div><div class="s">${esc([m("m_phone"),m("m_site")].filter(Boolean).join("\n"))}</div></div>
      <div><div class="k">Architect / designer</div><div class="v">${esc(m("m_architect")||"—")}</div></div>
      <div><div class="k">Prepared by</div><div class="v">${esc(m("m_by")||"HIKO team")}</div><div class="s">${esc(m("m_byphone"))}</div></div>
    </div>
    <div class="d-body">${body}</div>
    ${items.length?`<div class="d-foot">
      <div>
        ${terms.length?`<div class="d-terms"><h4>Terms and conditions</h4><ol>${terms.map(t=>`<li>${esc(t)}</li>`).join("")}</ol></div>`:""}
        ${m("m_pay")?`<div class="d-pay"><h4>Payment details</h4>${esc(m("m_pay"))}</div>`:""}
        <div class="d-thanks"><b>Thank you for considering HIKO</b>For orders and queries, contact ${esc(m("m_by")||"our team")}${m("m_byphone")?" at "+esc(m("m_byphone")):""}.</div>
      </div>
      <div>${totalsHtml}</div>
    </div>`:""}
    <div class="d-end"><span>HIKO Industry Pvt. Ltd.</span><span>www.hikoindustry.com · customercare@hikoindustry.com</span></div>`;
  fitPreview();
}
function fitPreview(){
  const st=$("stage"),sc=$("scaler"),doc=$("doc");
  if(window.matchMedia("print").matches)return;
  const w=st.clientWidth-28;const s=Math.min(1,w/794);
  sc.style.transform=`scale(${s})`;st.style.height=(doc.offsetHeight*s+28)+"px";
}

/* ---------- persistence ---------- */
const FIELDS=["m_customer","m_phone","m_site","m_architect","m_no","m_date","m_valid","m_by","m_byphone","m_disc","m_discLabel","m_round","m_terms","m_pay"];
const TOGGLES=["t_hide","t_group","t_img"];
function snapshot(){const d={items:JSON.parse(JSON.stringify(items)),saved:Date.now()};FIELDS.forEach(f=>d[f]=$(f).value);TOGGLES.forEach(t=>d[t]=$(t).checked);return d}
function restore(d){FIELDS.forEach(f=>{if(d[f]!==undefined)$(f).value=d[f]});TOGGLES.forEach(t=>{if(d[t]!==undefined)$(t).checked=d[t]});items=d.items||[];render()}
function render(){renderRows();renderDoc();LS.set("hiko_q_draft",snapshot())}
function saveQuote(){
  if(!items.length){toast("Add at least one product before saving");return}
  const all=LS.get("hiko_q_saved",[]);const d=snapshot();const no=d.m_no;
  const i=all.findIndex(q=>q.m_no===no);if(i>=0)all[i]=d;else all.unshift(d);
  LS.set("hiko_q_saved",all.slice(0,100));
  const m=/(\d+)$/.exec(no);if(m)LS.set("hiko_q_counter",Math.max(LS.get("hiko_q_counter",0),+m[1]));
  LS.set("hiko_q_staff",{m_by:d.m_by,m_byphone:d.m_byphone,m_pay:d.m_pay,m_terms:d.m_terms});
  toast(`Saved ${no}`);
}
function newQuote(){
  const st=LS.get("hiko_q_staff",{});
  ["m_customer","m_phone","m_site","m_architect"].forEach(f=>$(f).value="");
  $("m_disc").value=0;$("m_date").value=today();$("m_valid").value=30;
  $("m_no").value=nextNo().no;$("m_by").value=st.m_by||"";$("m_byphone").value=st.m_byphone||"";
  $("m_pay").value=st.m_pay||"";$("m_terms").value=st.m_terms||DEFAULT_TERMS.join("\n");
  $("t_hide").checked=false;items=[];render();
}
function openSaved(){
  const all=LS.get("hiko_q_saved",[]);
  $("savedList").innerHTML=all.length?all.map((q,i)=>`<div class="sq"><div><b>${esc(q.m_customer||"Unnamed customer")}</b><small>${esc(q.m_no)} · ${fmtDate(q.m_date)} · ${q.items.length} lines</small></div><button class="sbtn" onclick="loadSaved(${i})">Open</button><button class="sbtn" onclick="dupSaved(${i})">Duplicate</button><button class="sbtn" onclick="delSaved(${i})" aria-label="Delete">✕</button></div>`).join(""):`<div class="empty">Quotes you save will be listed here.</div>`;
  $("drawer").classList.add("open");$("drawer").setAttribute("aria-hidden","false");
}
function closeSaved(){$("drawer").classList.remove("open");$("drawer").setAttribute("aria-hidden","true")}
window.loadSaved=i=>{restore(LS.get("hiko_q_saved",[])[i]);closeSaved();toast("Quote opened")};
window.dupSaved=i=>{const q=LS.get("hiko_q_saved",[])[i];restore(q);$("m_no").value=nextNo().no;$("m_date").value=today();render();closeSaved();toast("Copied as a new quote")};
window.delSaved=i=>{const all=LS.get("hiko_q_saved",[]);if(!confirm(`Delete ${all[i].m_no}?`))return;all.splice(i,1);LS.set("hiko_q_saved",all);openSaved()};

/* ---------- share / pdf ---------- */
function waSummary(){
  if(!items.length){toast("Add products first");return}
  const T=totals(),hide=$("t_hide").checked;
  const lines=[`*HIKO Quotation ${$("m_no").value}*`,`For: ${$("m_customer").value||"Customer"}`,`Date: ${fmtDate($("m_date").value)}`,""];
  orderedItems().forEach(({x},k)=>{const p=byId[x.pid],v=p.v[x.vi],a=lineAmt(x);lines.push(`${k+1}. ${p.name} – ${v.l}${x.fin?" ("+x.fin+")":""} × ${x.qty}${hide||a==null?"":" = "+money(a)}`)});
  if(!hide){lines.push("",`*Grand total: ${money(T.grand)}* (incl. GST)`)}
  if($("m_by").value)lines.push("",`– ${$("m_by").value} ${$("m_byphone").value}`);
  const ph=$("m_phone").value.replace(/\D/g,"");const num=ph.length===10?"91"+ph:ph;
  window.open(`https://wa.me/${num}?text=${encodeURIComponent(lines.join("\n"))}`,"_blank");
}
function fitPage(){
  let st=$("pageSize");if(!st){st=document.createElement("style");st.id="pageSize";document.head.appendChild(st)}
  const sc=$("scaler"),prev=sc.style.transform;sc.style.transform="none";
  const mm=Math.ceil($("doc").offsetHeight*210/794)+1;sc.style.transform=prev;
  st.textContent=`@page{size:210mm ${Math.max(mm,100)}mm;margin:0}`;
}
function printPdf(){
  fitPage();
  if(!items.length){toast("Add products first");return}
  const old=document.title;document.title=`HIKO Quotation ${$("m_no").value.replace(/\//g,"-")} ${$("m_customer").value}`.trim();
  window.print();setTimeout(()=>document.title=old,500);
}

/* ---------- wire up ---------- */
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setCat(b.dataset.cat));
$("pProd").onchange=()=>{currentId=$("pProd").value;fillVariants()};
$("pVar").onchange=fillFinish;$("pFin").onchange=updatePick;
$("btnAdd").onclick=addItem;
$("pQty").addEventListener("keydown",e=>{if(e.key==="Enter")addItem()});
$("q").addEventListener("input",doSearch);
$("q").addEventListener("keydown",e=>{
  const rs=[...document.querySelectorAll(".res")];
  if(e.key==="ArrowDown"){act=Math.min(rs.length-1,act+1);e.preventDefault()}
  else if(e.key==="ArrowUp"){act=Math.max(0,act-1);e.preventDefault()}
  else if(e.key==="Enter"){pickHit(act<0?0:act);return}
  else if(e.key==="Escape"){$("results").classList.remove("open");return}
  rs.forEach((r,k)=>r.classList.toggle("act",k===act));rs[act]&&rs[act].scrollIntoView({block:"nearest"});
});
$("results").addEventListener("click",e=>{const b=e.target.closest(".res");if(b)pickHit(+b.dataset.k)});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))$("results").classList.remove("open")});
FIELDS.forEach(f=>$(f).addEventListener("input",render));TOGGLES.forEach(t=>$(t).addEventListener("change",render));
$("btnNew").onclick=()=>{if(items.length&&!confirm("Start a new quote? Unsaved changes on this one will be cleared."))return;newQuote()};
$("btnSave").onclick=saveQuote;$("btnSaved").onclick=openSaved;$("closeDrawer").onclick=closeSaved;
$("drawer").addEventListener("click",e=>{if(e.target.id==="drawer")closeSaved()});
$("btnWa").onclick=waSummary;$("btnPdf").onclick=printPdf;
window.addEventListener("resize",fitPreview);
window.addEventListener("beforeprint",()=>{fitPage();$("scaler").style.transform="none"});
window.addEventListener("afterprint",fitPreview);

(function init(){
  fillProducts();
  const draft=LS.get("hiko_q_draft",null);
  if(draft&&draft.items){restore(draft)}else newQuote();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitPreview);
})();
</script>
</body>
